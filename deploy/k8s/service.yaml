apiVersion: v1
kind: Service
metadata:
  name: errand-agent-api
  namespace: errand-agent
  labels:
    app.kubernetes.io/name: errand-agent-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: errand-agent-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: errand-agent-api-hpa
  namespace: errand-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: errand-agent-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: errand-agent-ingress
  namespace: errand-agent
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  rules:
    - host: errand.orange.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: errand-agent-api
                port:
                  number: 80
