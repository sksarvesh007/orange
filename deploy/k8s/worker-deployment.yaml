apiVersion: apps/v1
kind: Deployment
metadata:
  name: errand-agent-worker
  namespace: errand-agent
  labels:
    app.kubernetes.io/name: errand-agent-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: errand-agent-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: errand-agent-worker
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: worker
          image: orange/errand-agent:latest
          command: ["python3", "-m", "errand_agent.worker"]
          envFrom:
            - configMapRef:
                name: errand-agent-config
            - secretRef:
                name: errand-agent-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
